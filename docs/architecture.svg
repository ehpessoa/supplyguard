<svg viewBox="0 0 1300 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura do SupplyGuard-AI: Um trigger (cron diario ou o botao Run Audit no dashboard) enfileira um job no BullMQ; o worker executa o StateGraph do LangGraph (cost_auditor to supplies_drafter), que chama os servidores MCP e o Gemini e grava em agent_tasks; o grafo pausa em supplies_committer (interruptBefore) ate que um humano aprove ou rejeite o pedido no dashboard React, retomando via updateState + invoke(null).">
<rect x="0" y="0" width="1300" height="950" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
  </marker>
</defs>
